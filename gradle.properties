# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# configured through the IDE.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned for 32 GB RAM: 6 GB heap leaves room for Android Studio + emulator.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# JDK Location (fixes Invalid Gradle JDK configuration in IDE)
org.gradle.java.home=C:/Program Files/Zulu/zulu-17

# Memory for the Kotlin compiler daemon (separate from the Gradle daemon).
kotlin.daemon.jvmargs=-Xmx2048m

# Enable configuration cache for faster builds (Gradle 9.x)
org.gradle.configuration-cache=true

# Reuse build outputs across builds (local build cache).
org.gradle.caching=true

# Run independent modules/tasks concurrently. Safe for decoupled projects
# and a clear win on a 8-core / 12-thread CPU.
org.gradle.parallel=true

# Only configure projects relevant to the requested tasks (faster sync/builds).
org.gradle.configureondemand=true

android.useAndroidX=true

# All dependencies are AndroidX, no Jetifier needed
android.enableJetifier=false

# Suppress sync warnings for library constraints (improves IDE performance)
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false