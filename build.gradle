// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// Tareas "boton" de SmartDisplay: Limpiar / Compilar / Instalar / Correr.
// Aparecen en el panel Gradle de Android Studio/IntelliJ (grupo "SmartDisplay")
// y se ejecutan desde PowerShell/terminal:  ./gradlew sdClean | sdBuild | sdRun
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('sdClean') {
    group = 'SmartDisplay'
    description = 'Limpiar el proyecto (clean)'
    dependsOn ':app:clean'
}

tasks.register('sdBuild') {
    group = 'SmartDisplay'
    description = 'Compilar el APK debug (nonRoot)'
    dependsOn ':app:assembleNonRootDebug'
}

tasks.register('sdInstall') {
    group = 'SmartDisplay'
    description = 'Instalar el APK debug en el dispositivo/emulador'
    dependsOn ':app:installNonRootDebug'
}

// Tarea Exec: instala y LANZA la app. En Gradle 9 el antiguo `exec {}` dentro de
// doLast ya no existe, por eso se usa el tipo Exec (compatible con config cache).
tasks.register('sdRun', Exec) {
    group = 'SmartDisplay'
    description = 'Instalar y ejecutar en el dispositivo/emulador'
    dependsOn ':app:installNonRootDebug'
    ignoreExitValue = true   // monkey puede devolver !=0 sin ser un fallo real
    boolean win = System.getProperty('os.name').toLowerCase().contains('win')
    String home = System.getProperty('user.home')
    String sdk = System.getenv('ANDROID_HOME') ?:
                 System.getenv('ANDROID_SDK_ROOT') ?:
                 "$home/AppData/Local/Android/Sdk"
    commandLine "$sdk/platform-tools/adb" + (win ? '.exe' : ''),
            'shell', 'monkey', '-p',
            'com.limelight.smartdisplay.debug',
            '-c', 'android.intent.category.LAUNCHER', '1'
}